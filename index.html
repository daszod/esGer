<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Spanisch Basics</title>
<meta name="apple-mobile-web-app-title" content="Spanisch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#faf7f2; --surface:#ffffff; --surface-2:#f1ece4; --text:#1d1a16; --muted:#6b645a;
  --line:#e4ddd2; --accent:#c8102e; --accent-ink:#ffffff; --accent-soft:#fbe3e6;
  --gold:#f1bf00; --ok:#1f8a4c; --ok-soft:#dff3e7; --bad:#c8102e; --bad-soft:#fbe3e6;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15130f; --surface:#1f1c17; --surface-2:#2a261f; --text:#f3eee6; --muted:#a59d90;
    --line:#38322a; --accent:#ff5468; --accent-ink:#1a0006; --accent-soft:#3a1a1f;
    --gold:#f5cc33; --ok:#4cc77f; --ok-soft:#183324; --bad:#ff5468; --bad-soft:#3a1a1f;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#15130f; --surface:#1f1c17; --surface-2:#2a261f; --text:#f3eee6; --muted:#a59d90;
  --line:#38322a; --accent:#ff5468; --accent-ink:#1a0006; --accent-soft:#3a1a1f;
  --gold:#f5cc33; --ok:#4cc77f; --ok-soft:#183324; --bad:#ff5468; --bad-soft:#3a1a1f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  border-bottom:1px solid var(--line);margin:0 -16px 14px}
.hrow{display:flex;align-items:center;gap:10px}
.flag{width:28px;height:20px;border-radius:4px;background:linear-gradient(var(--accent) 0 25%,var(--gold) 25% 75%,var(--accent) 75%);flex:none}
h1{font-size:18px;margin:0;flex:1;letter-spacing:-.01em}
.dir{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.dir b{color:var(--accent)}
.levels{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;margin-top:10px}
.levels button{flex:1;border:0;background:transparent;padding:6px 0;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.levels button.on{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 10px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--shadow)}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.pad{padding:16px}
.flash{min-height:250px;margin:12px 0;padding:34px 20px 24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative;user-select:none}
.flash .lang{position:absolute;top:12px;left:14px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.flash .q{font-size:26px;font-weight:650;line-height:1.25;letter-spacing:-.01em}
.flash .sub{font-size:16px;color:var(--muted);margin-top:6px}
.flash .a{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line);width:100%;font-size:22px;color:var(--accent);font-weight:600}
.flash .tap{margin-top:18px;font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:8px;font-weight:400}
.speak{border:0;background:var(--accent-soft);color:var(--accent);width:42px;height:42px;border-radius:50%;display:inline-grid;place-items:center;flex:none}
.speak svg{width:20px;height:20px}
.flash .speak{position:absolute;top:10px;right:10px}
.play{border:0;background:var(--accent);color:var(--accent-ink);width:84px;height:84px;border-radius:50%;display:grid;place-items:center}
.play svg{width:38px;height:38px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;font-weight:600;flex:1;min-height:52px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.small{flex:none;min-height:40px;padding:8px 12px;font-size:14px;border-radius:10px}
.btn.full{width:100%}
.btn:disabled{opacity:.45}
.list{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.item{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px}
.item .t{flex:1;min-width:0}
.item .es{font-weight:600}
.item .de{color:var(--muted);font-size:14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.dot.b1,.dot.b2{background:var(--gold)} .dot.b3,.dot.b4,.dot.b5{background:var(--ok)}
.sec{margin:20px 0 8px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;font-size:17px;min-height:54px}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
input.answer{width:100%;font:inherit;font-size:18px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);margin-top:14px;outline:none}
input.answer:focus{border-color:var(--accent)}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.keys button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;min-width:38px;height:38px;font-size:16px}
.fb{margin-top:14px;padding:14px 16px;border-radius:14px;font-weight:500}
.fb.ok{background:var(--ok-soft);color:var(--ok)} .fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb .sol{display:block;color:var(--text);font-weight:650;margin-top:4px;font-size:17px}
.fb .sol2{display:block;color:var(--muted);font-weight:400;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.stat{padding:12px;text-align:center}
.stat b{display:block;font-size:24px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field .seg{display:flex}
.field .seg button{flex:1}
select{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text)}
input[type=range]{width:100%;accent-color:var(--accent)}
.big{font-size:56px;font-weight:750;text-align:center;letter-spacing:-.03em;margin:8px 0 0}
.ctable{width:100%;border-collapse:collapse}
.ctable td{padding:10px 6px;border-top:1px solid var(--line);vertical-align:middle}
.ctable tr:first-child td{border-top:0}
.ctable .p{color:var(--muted);font-size:14px;width:42%}
.ctable .f{font-weight:650;font-size:17px}
.ctable .s{width:46px;text-align:right}
.ctable .speak{width:36px;height:36px}
.hf{min-height:190px;margin:0;padding:22px 18px}
.hf .es{font-size:24px;font-weight:650;color:var(--accent)}
.hf .de{font-size:18px;margin-top:8px}
.hint{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:10px 12px;margin-top:12px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;min-width:0;border:0;background:transparent;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);border-radius:12px}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--accent);font-weight:700}
.reset{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;padding:8px 0;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hrow">

  <main id="app"></main>

    <button data-tab="listen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14v-2a9 9 0 0 1 18 0v2"/><rect x="3" y="14" width="5" height="7" rx="2"/><rect x="16" y="14" width="5" height="7" rx="2"/></svg>Hören</button>

  </div>
</nav>

function conjugate(inf, t){
  const irr = IRR[inf] || {}, type = inf.slice(-2), stem = inf.slice(0, -2);
  if (irr[t]) return irr[t];
  if (END[t]) return END[t][type].map(e => stem + e);
  if (t === "fut")  return sp("é ás á emos éis án").map(e => (irr.futStem || inf) + e);
  if (t === "cond") return sp("ía ías ía íamos íais ían").map(e => (irr.futStem || inf) + e);
  if (t === "perf"){
    const part = irr.part || stem + (type === "ar" ? "ado" : "ido");
    return sp("he has ha hemos habéis han").map(h => h + " " + part);
  }
  if (t === "subjimp"){
    const base = conjugate(inf, "indef")[5].slice(0, -3);
    const acc = base.slice(0, -1) + ({a:"á", e:"é"}[base.slice(-1)] || base.slice(-1));
    return [base + "ra", base + "ras", base + "ra", acc + "ramos", base + "rais", base + "ran"];
  }
  return [];
}

// Spricht Text und liefert ein Promise, das nach dem Sprechen erfüllt ist.
function say(text, lang = "es", rate){
  return new Promise(res => {
    if (!TTS) return res();
    try {
      const u = new SpeechSynthesisUtterance(text.replace(/…/g, ""));
      u.lang = lang === "es" ? (esVoice ? esVoice.lang : "es-ES") : "de-DE";
      u.rate = rate || store.rate;
      const v = lang === "es" ? esVoice : deVoice; if (v) u.voice = v;
      let done = false; const fin = () => { if (!done){ done = true; res(); } };
      u.onend = fin; u.onerror = fin;
      setTimeout(fin, 2500 + text.length * 180 / u.rate);
      speechSynthesis.speak(u);
    } catch(e){ res(); }
  });
}
function speak(text, rate){ if (TTS){ try { speechSynthesis.cancel(); } catch(e){} } say(text, "es", rate); }

function norm(s, keepAccents){
  s = s.toLowerCase().replace(/\(.*?\)/g, " ").replace(/[¿¡?!.,;:…"'«»]/g, " ");
  if (!keepAccents) s = s.normalize("NFD").replace(/[̀-ͯ]/g, "");
  return s.replace(/\s+/g, " ").trim();
}
const ARTICLES = /^(der|die|das|ein|eine|el|la|los|las|un|una) /;
function variants(ans, keep){
  const out = new Set();
  // "froh, zufrieden" → beides gilt; ganze Sätze mit Komma werden nicht zerlegt.
  const parts = ans.split("/").flatMap(p => p.split(",").every(x => x.trim().split(" ").length <= 2) ? p.split(",") : [p]);
  for (const part of parts){
    const n = norm(part, keep); if (!n) continue;
    out.add(n); out.add(n.replace(ARTICLES, ""));
  }
  out.add(norm(ans, keep));
  return out;
}
function check(input, ans){
  const a = norm(input, true), b = norm(input, false);
  if (!b) return "empty";
  const vk = variants(ans, true), vn = variants(ans, false);
  if (vk.has(a) || vk.has(a.replace(ARTICLES, ""))) return "ok";
  if (vn.has(b) || vn.has(b.replace(ARTICLES, ""))) return "accent";
  return "bad";
}

/* ---------- Fragen bauen ---------- */
function pickOptions(answer, pool){
  const out = [], used = new Set([answer]);
  for (const a of pool){ if (!used.has(a)){ used.add(a); out.push(a); if (out.length === 3) break; } }
  return shuffle([answer, ...out]);
}
function distractors(it, f){
  const same = ITEMS.filter(x => x.kind === it.kind && x.id !== it.id);
  return [
    ...shuffle(same.filter(x => x.cat === it.cat && x.lvl === it.lvl)),
    ...shuffle(same.filter(x => x.lvl === it.lvl && x.cat !== it.cat)),
    ...shuffle(same.filter(x => x.lvl !== it.lvl))
  ].map(f);
}
function qFromItem(it, type){
  const base = {id: it.id, es: it.es, de: it.de, note: it.note, say: it.es};
  if (type === "listen"){
    return {...base, type: "choice", listen: true, label: "HÖREN → DEUTSCH", prompt: "", answer: it.de,
            opts: pickOptions(it.de, distractors(it, x => x.de))};
  }
  const d = deFirst();
  const q = {...base, type, label: d ? "DEUTSCH → ESPAÑOL" : "ESPAÑOL → DEUTSCH", prompt: d ? it.de : it.es,
             answer: d ? it.es : it.de, toEs: d, promptEs: !d};
  if (type === "choice") q.opts = pickOptions(q.answer, distractors(it, x => d ? x.es : x.de));
  return q;
}
function mixType(id, type){
  if (type !== "mix") return type;
  return (box(id) >= 2 && Math.random() < .6) ? "type" : "choice";
}
function conjQuestions(n, type){
  const ts = tensesFor(), qs = [];
  const all = [];
  for (const [inf, de] of VERBS) for (const t of ts) for (let p = 0; p < 6; p++) all.push({inf, de, t, p, id: `conj:${inf}:${t.k}:${p}`});
  const picked = shuffle(all).sort((a, b) => box(a.id) - box(b.id)).slice(0, n);
  for (const c of picked){
    const forms = conjugate(c.inf, c.t.k), ans = forms[c.p];
    const qt = mixType(c.id, type);
    qs.push({id: c.id, type: qt, label: "KONJUGIEREN", prompt: `${c.inf} (${c.de})`, sub: `${c.t.name} · ${PERSONS[c.p]}`,
      answer: ans, say: ans, es: `${PERSONS[c.p].split("/")[0]} ${ans}`, de: `${c.inf} · ${c.t.name}`, note: c.t.de, toEs: true,
      opts: qt === "choice" ? pickOptions(ans, shuffle([...forms, ...conjugate(c.inf, ts[Math.floor(Math.random() * ts.length)].k)])) : null});
  }
  return qs;
}
function startRound(tab, makeQs){
  const qs = makeQs();
  if (!qs.length) return;
  view.rounds[tab] = {qs, i: 0, done: false, regen: makeQs};
  render();
}

/* ---------- Render: Sätze / Wörter ---------- */
function renderBrowse(kind){
  const st = view.browse[kind];
  const list = itemsFor(kind, st.cat);
  if (!st.order || st.order.length !== list.length) st.order = list.map((_, i) => i);
  const cats = ["Alle", ...catsFor(kind)];
  let h = `<div class="chips">${cats.map(c => `<button class="chip ${c === st.cat ? "on" : ""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}</div>
  <div class="row between">
    <div class="seg"><button data-mode="cards" class="${st.mode === "cards" ? "on" : ""}">Karten</button><button data-mode="list" class="${st.mode === "list" ? "on" : ""}">Liste</button></div>
    ${st.mode === "cards" ? `<button class="btn small" id="shuf">Mischen</button>` : `<span class="muted">${list.length} Einträge</span>`}
  </div>`;

  if (!list.length){
    $("#app").innerHTML = h + `<p class="muted">Für dieses Niveau gibt es hier noch keine Einträge.</p>`; bindCommon(st); return;
  }
  if (st.mode === "list"){
    h += `<div class="list" style="margin-top:12px">` + list.map(it => `
      <div class="card item"><span class="dot b${box(it.id)}"></span>
        <div class="t"><div class="es">${esc(it.es)}</div><div class="de">${esc(it.de)}${it.note ? " · " + esc(it.note) : ""}</div></div>
        <button class="speak" data-say="${esc(it.es)}" aria-label="Anhören">${SPK}</button></div>`).join("") + `</div>`;
  } else {
    if (st.i >= list.length) st.i = 0;
    const it = list[st.order[st.i]];
    h += `<div class="card flash" id="flash">
      <span class="lang">${deFirst() ? "DEUTSCH" : "ESPAÑOL"}</span>
      <button class="speak" data-say="${esc(it.es)}" aria-label="Anhören">${SPK}</button>
      <div class="q">${esc(deFirst() ? it.de : it.es)}</div>
      ${st.flipped ? `<div class="a">${esc(deFirst() ? it.es : it.de)}${it.note ? `<div class="note">${esc(it.note)}</div>` : ""}</div>` : `<div class="tap">Tippen zum Aufdecken</div>`}
    </div>
    <div class="row between" style="margin-bottom:10px">
      <button class="btn small" id="prev">‹ Zurück</button>
      <span class="muted">${st.i + 1} / ${list.length}</span>
      <button class="btn small" id="next">Weiter ›</button>
    </div>
    <div class="row">
      <button class="btn bad" id="again" ${st.flipped ? "" : "disabled"}>Nochmal</button>
      <button class="btn ok" id="knew" ${st.flipped ? "" : "disabled"}>Gewusst ✓</button>
    </div>`;
  }
  $("#app").innerHTML = h;
  bindCommon(st);
  if (st.mode === "cards"){
    const go = d => { st.i = (st.i + d + list.length) % list.length; st.flipped = false; render(); };
    $("#flash").onclick = e => {
      if (e.target.closest(".speak")) return;
      st.flipped = !st.flipped; render();
      if (st.flipped && deFirst()) speak(list[st.order[st.i]].es);
    };
    $("#prev").onclick = () => go(-1);
    $("#next").onclick = () => go(1);
    $("#shuf").onclick = () => { st.order = shuffle(list.map((_, i) => i)); st.i = 0; st.flipped = false; render(); };
    $("#again").onclick = () => { mark(list[st.order[st.i]].id, false); go(1); };
    $("#knew").onclick = () => { mark(list[st.order[st.i]].id, true); go(1); };
  }
}
function bindCommon(st){
  $$("[data-cat]").forEach(b => b.onclick = () => { st.cat = b.dataset.cat; st.i = 0; st.flipped = false; st.order = null; render(); });
  $$("[data-mode]").forEach(b => b.onclick = () => { st.mode = b.dataset.mode; render(); });
  bindSpeak();
}
function bindSpeak(){
  $$("[data-say]").forEach(b => b.onclick = e => { e.stopPropagation(); speak(b.dataset.say, b.dataset.rate ? +b.dataset.rate : undefined); });
}

/* ---------- Render: Verben ---------- */
function renderVerbs(){
  const V = view.verbs, ts = tensesFor();
  if (!ts.some(t => t.k === V.tense)) V.tense = ts[0].k;
  const t = TENSES.find(x => x.k === V.tense);
  const de = VERBS.find(v => v[0] === V.verb)[1];
  const forms = conjugate(V.verb, V.tense);
  $("#app").innerHTML = `
    <div class="chips">${VERBS.map(([inf]) => `<button class="chip ${inf === V.verb ? "on" : ""}" data-verb="${inf}">${inf}</button>`).join("")}</div>
    <div class="field"><label>Zeitform (bis ${store.lvl})</label>
      <select id="tense">${ts.map(x => `<option value="${x.k}" ${x.k === V.tense ? "selected" : ""}>${x.lvl} · ${x.name}</option>`).join("")}</select></div>
    <div class="card pad">
      <div class="row between"><div><div style="font-size:22px;font-weight:700">${V.verb}</div><div class="muted">${esc(de)}</div></div>
        <button class="speak" data-say="${esc(V.verb)}" aria-label="Anhören">${SPK}</button></div>
      <div class="muted" style="margin:10px 0 4px"><b style="color:var(--text)">${t.name}</b> – ${esc(t.de)}</div>
      <table class="ctable">${forms.map((f, i) => `<tr><td class="p">${PERSONS[i]}</td><td class="f">${esc(f)}</td>
        <td class="s"><button class="speak" data-say="${esc(PERSONS[i].split("/")[0] + " " + f)}" aria-label="Anhören">${SPK}</button></td></tr>`).join("")}</table>
    </div>
    <div class="row" style="margin-top:14px"><button class="btn primary" id="conjGo">Konjugation üben (10)</button></div>
    <p class="muted">Abgefragt werden alle Verben in den Zeitformen bis ${store.lvl}. Schwache Formen kommen zuerst.</p>`;
  $$("[data-verb]").forEach(b => b.onclick = () => { V.verb = b.dataset.verb; render(); });
  $("#tense").onchange = e => { V.tense = e.target.value; render(); };
  bindSpeak();
  $("#conjGo").onclick = () => startRound("verbs", () => conjQuestions(10, "mix"));
}

  $("#app").innerHTML = `
    <div class="field"><label>Inhalt (${store.lvl})</label>
      <div class="seg">${[["phrases","Sätze"],["words","Wörter"]].map(([k,t]) => `<button data-src="${k}" class="${L.src === k ? "on" : ""}">${t}</button>`).join("")}</div></div>

    <div class="sec">Hörquiz</div>
    <div class="card pad">
      <p style="margin:0 0 12px">Du hörst Spanisch und wählst die richtige Übersetzung. Ohne mitzulesen.</p>

    <div class="sec">Freihändig hören</div>
    <div class="card hf flash" id="hfCard"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn ${hf.on ? "bad" : "primary"}" id="hfBtn" ${pool.length ? "" : "disabled"}>${hf.on ? "Stopp" : "Abspielen"}</button>
    </div>
    <p class="muted">${deFirst()
      ? "Ablauf: Deutsch → Pause zum Selbst-Übersetzen → Spanisch → Spanisch langsam."
      : "Ablauf: Spanisch → Pause zum Selbst-Übersetzen → Deutsch."} Richtung oben umschaltbar.</p>

    <div class="sec">Stimme & Tempo</div>
    <div class="card pad">
      ${TTS ? `
      <div class="field"><label>Spanische Stimme</label>
        <select id="voiceSel"><option value="">Automatisch</option>${voiceOpts}</select></div>
      <div class="field"><label>Tempo: <span id="rateVal">${store.rate.toFixed(2)}</span></label>
        <input type="range" id="rate" min="0.5" max="1.1" step="0.05" value="${store.rate}"></div>
      <button class="btn full" id="vTest">Stimme testen</button>
      <div class="hint">Tipp fürs iPhone: Einstellungen → Bedienungshilfen → Gesprochene Inhalte → Stimmen → Spanisch.
      Dort eine Stimme mit „Erweitert“ oder „Premium“ laden (z. B. Mónica oder Jorge). Sie klingt deutlich natürlicher, funktioniert offline
      und erscheint danach hier in der Liste.</div>` : `<p class="muted">Dein Browser unterstützt keine Sprachausgabe.</p>`}
    </div>`;
  updateHF();
  $$("[data-src]").forEach(b => b.onclick = () => { L.src = b.dataset.src; stopHF(); render(); });
  $("#lqGo").onclick = () => startRound("listen", () => {
    const pick = shuffle(itemsFor(L.src, "Alle")).sort((a, b) => box(a.id) - box(b.id)).slice(0, 10);
    return shuffle(pick).map(it => qFromItem(it, "listen"));
  });
  $("#hfBtn").onclick = () => { if (hf.on) stopHF(); else startHF(); render(); };
  if (TTS){
    $("#voiceSel").onchange = e => { store.voice = e.target.value; save(); pickVoices(); };
    $("#rate").oninput = e => { store.rate = +e.target.value; $("#rateVal").textContent = store.rate.toFixed(2); save(); };
    $("#vTest").onclick = () => speak("Hola, ¿qué tal? Estoy aprendiendo español.");
  }
}
function updateHF(){
  const el = $("#hfCard"); if (!el) return;
  const it = hf.it;
  if (!it){ el.innerHTML = `<div class="muted">Ideal für unterwegs: Kopfhörer rein, zuhören, im Kopf mitübersetzen.</div>`; return; }
  const showEs = hf.show === "es" || hf.show === "both", showDe = hf.show === "de" || hf.show === "both";
  el.innerHTML = `<span class="lang">${hf.on ? "LÄUFT" : "PAUSE"}</span>
    <div class="es">${showEs ? esc(it.es) : "…"}</div><div class="de">${showDe ? esc(it.de) : "…"}</div>`;
}
function stopHF(){ hf.on = false; hf.token++; if (TTS) try { speechSynthesis.cancel(); } catch(e){} updateHF(); }
async function startHF(){
  hf.on = true; const tok = ++hf.token;
  const alive = () => hf.on && tok === hf.token;
  const list = shuffle(itemsFor(view.listen.src, "Alle"));
  let i = 0;
  while (alive() && list.length){
    const it = list[i % list.length]; hf.it = it;
    if (deFirst()){
      hf.show = "de"; updateHF(); await say(it.de, "de", 1);
      if (!alive()) return; await wait(2800); if (!alive()) return;
      hf.show = "both"; updateHF(); await say(it.es, "es");
      if (!alive()) return; await wait(700); if (!alive()) return;
      await say(it.es, "es", Math.max(.5, store.rate - .2));
    } else {
      hf.show = "es"; updateHF(); await say(it.es, "es");
      if (!alive()) return; await wait(2800); if (!alive()) return;
      hf.show = "both"; updateHF(); await say(it.de, "de", 1);
    }
    if (!alive()) return; await wait(1500);
    i++;
  }
}

/* ---------- Render: Lernmodus ---------- */
function renderLearn(){
  const L = view.learn;
  const pool = itemsFor(L.src, L.cat);
  const known = pool.filter(it => box(it.id) >= 3).length;
  const learning = pool.filter(it => seen(it.id) && box(it.id) < 3).length;
  const cats = L.src === "all" ? [] : catsFor(L.src);
  $("#app").innerHTML = `
    <div class="muted" style="margin-bottom:6px">Niveau <b style="color:var(--text)">${store.lvl}</b> · ${LEVEL_NAMES[store.lvl]}</div>
    <div class="stats">
      <div class="card stat"><b>${pool.length - known - learning}</b><span>Neu</span></div>
      <div class="card stat"><b style="color:var(--gold)">${learning}</b><span>Am Lernen</span></div>
      <div class="card stat"><b style="color:var(--ok)">${known}</b><span>Sicher</span></div>
    </div>
    <div class="sec">Neue Runde</div>
    <div class="card pad">
      <div class="field"><label>Inhalt</label>
        <div class="seg">${[["all","Alles"],["phrases","Sätze"],["words","Wörter"]].map(([k,t]) => `<button data-src="${k}" class="${L.src === k ? "on" : ""}">${t}</button>`).join("")}</div></div>
      ${cats.length ? `<div class="field"><label>Thema</label><select id="cat"><option>Alle</option>${cats.map(c => `<option ${c === L.cat ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></div>` : ""}
      <div class="field"><label>Übungsart</label>
        <div class="seg">${[["mix","Mix"],["choice","Auswählen"],["type","Schreiben"]].map(([k,t]) => `<button data-type="${k}" class="${L.type === k ? "on" : ""}">${t}</button>`).join("")}</div></div>
      <p class="muted" style="margin:0 0 14px">10 Fragen · ${deFirst() ? "Deutsch → Spanisch" : "Spanisch → Deutsch"} (oben umschaltbar). Schwache und neue Einträge kommen zuerst.</p>
      <button class="btn primary full" id="start" ${pool.length ? "" : "disabled"}>Los geht's</button>
    </div>
    <button class="reset" id="reset">Lernfortschritt zurücksetzen</button>`;

  $$("[data-src]").forEach(b => b.onclick = () => { L.src = b.dataset.src; L.cat = "Alle"; render(); });
  $$("[data-type]").forEach(b => b.onclick = () => { L.type = b.dataset.type; render(); });
  const sel = $("#cat"); if (sel) sel.onchange = () => { L.cat = sel.value; render(); };
  $("#start").onclick = () => startRound("learn", () => {
    const pick = shuffle(itemsFor(L.src, L.cat)).sort((a, b) => box(a.id) - box(b.id)).slice(0, 10);
    return shuffle(pick).map(it => qFromItem(it, mixType(it.id, L.type)));
  });
  $("#reset").onclick = () => { if (confirm("Gesamten Lernfortschritt löschen?")) { store.prog = {}; save(); render(); } };
}

/* ---------- Render: Quiz-Runde (für alle Bereiche) ---------- */
function renderQuestion(R){
  const q = R.qs[R.i];
  let h = `<div class="row between"><span class="muted">Frage ${R.i + 1} von ${R.qs.length}</span><button class="btn small" id="quit">Beenden</button></div>
    <div class="bar"><i style="width:${(R.i / R.qs.length) * 100}%"></i></div>`;

  if (q.listen){
    h += `<div class="card flash" style="min-height:200px">
      <span class="lang">${q.label}</span>
      <button class="play" data-say="${esc(q.say)}" aria-label="Abspielen">${PLAY}</button>
      <button class="btn small" data-say="${esc(q.say)}" data-rate="0.6" style="margin-top:14px">Langsam</button>
      ${q.answered ? `<div class="a">${esc(q.es)}</div>` : ""}
    </div>`;
  } else {
    h += `<div class="card flash" style="min-height:170px">
      <span class="lang">${q.label}</span>
      ${q.promptEs || q.answered ? `<button class="speak" data-say="${esc(q.say)}" aria-label="Anhören">${SPK}</button>` : ""}
      <div class="q">${esc(q.prompt)}</div>${q.sub ? `<div class="sub">${esc(q.sub)}</div>` : ""}
    </div>`;
  }

  if (q.type === "choice"){
    h += `<div class="opts">${q.opts.map((o, k) => {
      let cls = "";
      if (q.answered){ if (o === q.answer) cls = "right"; else if (o === q.pick) cls = "wrong"; }
      return `<button class="opt ${cls}" data-k="${k}" ${q.answered ? "disabled" : ""}>${esc(o)}</button>`;
    }).join("")}</div>`;
  } else {
    h += `<input class="answer" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${q.toEs ? "Auf Spanisch …" : "Auf Deutsch …"}" value="${esc(q.input || "")}" ${q.answered ? "disabled" : ""}>`;
    if (q.toEs && !q.answered) h += `<div class="keys">${["á","é","í","ó","ú","ñ","ü","¿","¡"].map(c => `<button data-key="${c}">${c}</button>`).join("")}</div>`;
    if (!q.answered) h += `<div class="row" style="margin-top:12px"><button class="btn" id="skip">Weiß ich nicht</button><button class="btn primary" id="chk">Prüfen</button></div>`;
  }

  if (q.answered){
    const msg = q.ok ? (q.accent ? "Richtig – achte auf die Akzente:" : "¡Muy bien! Richtig.") : "Leider falsch. Richtig ist:";
    h += `<div class="fb ${q.ok ? "ok" : "bad"}">${msg}<span class="sol">${esc(q.answer)}</span>
      ${q.listen ? `<span class="sol2">${esc(q.es)}</span>` : ""}${q.note ? `<div class="note">${esc(q.note)}</div>` : ""}</div>
      <div class="row" style="margin-top:12px"><button class="btn primary" id="nxt">${R.i + 1 < R.qs.length ? "Weiter" : "Ergebnis"}</button></div>`;
  }
  $("#app").innerHTML = h;
  bindSpeak();

  if (q.listen && !q.played){ q.played = true; speak(q.say); }
  const finish = (ok, extra) => {
    Object.assign(q, {answered: true, ok}, extra || {});
    mark(q.id, ok); render(); speak(q.say);
  };
  $("#quit").onclick = () => { delete view.rounds[view.tab]; render(); };
  if (!q.answered){
    if (q.type === "choice"){
      $$("[data-k]").forEach(b => b.onclick = () => { const pick = q.opts[+b.dataset.k]; finish(pick === q.answer, {pick}); });
    } else {
      const inp = $("#ans");
      setTimeout(() => inp.focus(), 50);
      const doCheck = () => {
        q.input = inp.value;
        const r = check(inp.value, q.answer);
        if (r === "empty") { inp.focus(); return; }
        finish(r !== "bad", {accent: r === "accent"});
      };
      inp.onkeydown = e => { if (e.key === "Enter") doCheck(); };
      inp.oninput = () => { q.input = inp.value; };
      $("#chk").onclick = doCheck;
      $("#skip").onclick = () => finish(false);
      $$("[data-key]").forEach(b => b.onclick = () => {
        const s = inp.selectionStart ?? inp.value.length, e = inp.selectionEnd ?? s;
        inp.value = inp.value.slice(0, s) + b.dataset.key + inp.value.slice(e);
        q.input = inp.value; inp.focus(); inp.setSelectionRange(s + 1, s + 1);
      });
    }
  } else {
    $("#nxt").onclick = () => { if (R.i + 1 < R.qs.length) R.i++; else R.done = true; render(); };
  }
}
function renderResult(R){
  const right = R.qs.filter(q => q.ok).length;
  const wrong = R.qs.filter(q => !q.ok);
  const pct = right / R.qs.length;
  const msg = pct === 1 ? "¡Perfecto! 🎉" : pct >= .7 ? "¡Muy bien!" : pct >= .4 ? "¡Bien! Weiter so." : "¡Ánimo! Übung macht den Meister.";
  $("#app").innerHTML = `
    <div class="card" style="padding:22px 18px;text-align:center">
      <div class="muted">Ergebnis</div>
      <div class="big">${right}/${R.qs.length}</div>
      <div style="font-weight:600;margin-top:4px">${msg}</div>
    </div>
    ${wrong.length ? `<div class="sec">Nochmal anschauen</div><div class="list">${wrong.map(q => `
      <div class="card item"><div class="t"><div class="es">${esc(q.es)}</div><div class="de">${esc(q.de)}</div></div>
      <button class="speak" data-say="${esc(q.say)}" aria-label="Anhören">${SPK}</button></div>`).join("")}</div>` : ""}
    <div class="row" style="margin-top:16px">
      ${wrong.length ? `<button class="btn" id="retry">Fehler üben</button>` : ""}
      <button class="btn primary" id="again">Neue Runde</button>
    </div>
    <div class="row" style="margin-top:8px"><button class="btn" id="back">Zur Übersicht</button></div>`;
  bindSpeak();
  const tab = view.tab;
  const retry = $("#retry");
  if (retry) retry.onclick = () => {
    const qs = shuffle(wrong).map(q => ({...q, answered: false, ok: null, pick: null, input: "", accent: false, played: false}));
    view.rounds[tab] = {qs, i: 0, done: false, regen: R.regen}; render();
  };
  $("#again").onclick = () => startRound(tab, R.regen);
  $("#back").onclick = () => { delete view.rounds[tab]; render(); };
}

/* ---------- Haupt-Render ---------- */
function render(){
  $("#dirBtn").innerHTML = deFirst() ? "DE <b>→</b> ES" : "ES <b>→</b> DE";
  $("#levels").innerHTML = LEVELS.map(l => `<button data-lvl="${l}" class="${l === store.lvl ? "on" : ""}" title="${LEVEL_NAMES[l]}">${l}</button>`).join("");
  $$("[data-lvl]").forEach(b => b.onclick = () => setLevel(b.dataset.lvl));
  $$("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === view.tab));
  const R = view.rounds[view.tab];
  if (R) return R.done ? renderResult(R) : renderQuestion(R);
  ({phrases: () => renderBrowse("phrases"), words: () => renderBrowse("words"), verbs: renderVerbs, listen: renderListen, learn: renderLearn})[view.tab]();
}
function setLevel(l){
  if (l === store.lvl) return;
  store.lvl = l; save(); stopHF(); hf.it = null;
  for (const st of Object.values(view.browse)) Object.assign(st, {cat: "Alle", i: 0, flipped: false, order: null});
  view.learn.cat = "Alle"; view.rounds = {};
  render();
}
$("#dirBtn").onclick = () => {
  store.dir = deFirst() ? "es-de" : "de-es"; save();
  view.browse.phrases.flipped = view.browse.words.flipped = false;
  if (hf.on){ stopHF(); }
  render();
};
$$("nav button").forEach(b => b.onclick = () => { view.tab = b.dataset.tab; render(); window.scrollTo(0, 0); });
render();

/* ---------- Offline-App ---------- */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
